<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>حضور و غیاب شخصی</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/logo.svg">
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .main-btn-green {
      background: linear-gradient(135deg, #34d399, #10b981);
      box-shadow: 0 10px 40px rgba(16,185,129,0.4), 0 0 0 4px rgba(16,185,129,0.15);
    }
    .main-btn-orange {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 10px 40px rgba(245,158,11,0.4), 0 0 0 4px rgba(245,158,11,0.15);
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <div id="datetime-display" style="color:white;font-size:0.9rem;font-weight:600;"></div>
      <button class="menu-btn" id="menu-btn"><i class="fas fa-bars"></i></button>
    </div>

    <div class="glass-card" style="margin-bottom:1.5rem;">
      <div id="status-card">
        <div class="empty-state" style="padding:1rem;">
          <i class="fas fa-info-circle"></i>
          <p>وضعیت امروز در حال بارگذاری...</p>
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:center;margin:2rem 0;">
      <button id="main-action-btn" class="main-action-btn main-btn-green">
        <i class="fas fa-sign-in-alt" style="font-size:2rem;"></i>
        <span style="font-size:1.1rem;font-weight:700;">ورود</span>
      </button>
    </div>

    <div class="stats-grid" style="margin-bottom:1.5rem;">
      <div class="stat-card">
        <div class="stat-value" id="stat-workdays">۰</div>
        <div class="stat-label">روز کاری</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-hours">۰</div>
        <div class="stat-label">ساعت کار</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-leaves">۰</div>
        <div class="stat-label">مرخصی</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
      <button class="btn btn-outline" onclick="window.location.href='./settings.html#manual'">
        <i class="fas fa-edit"></i> ثبت دستی
      </button>
      <button class="btn btn-outline" onclick="window.location.href='./settings.html#daily-leave'">
        <i class="fas fa-umbrella-beach"></i> مرخصی روزانه
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment-jalaali@0.9.2/build/moment-jalaali.js"></script>
  <script src="./js/date-utils.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/pages/home.js"></script>
</body>
</html>
