<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#6366f1" />
    <title>تنظیمات حضور و غیاب</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="page-header">
        <h1 class="page-title">
          <i class="fas fa-cog" style="margin-left: 0.5rem"></i>تنظیمات
        </h1>
        <button class="menu-btn" id="menu-btn-settings">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <div
        class="glass-card animate-fade-in"
        id="manual-section"
        style="margin-bottom: 1rem"
      >
        <h3 style="color: white; font-weight: 700; margin-bottom: 1rem">
          <i class="fas fa-edit" style="margin-left: 0.5rem"></i>ثبت دستی رکورد
        </h3>
        <form id="manual-form">
          <div class="form-group">
            <label class="form-label" style="color: rgba(255, 255, 255, 0.9)"
              >تاریخ</label
            >
            <input
              type="text"
              id="manual-date"
              class="form-input"
              placeholder="۱۴۰۳/۰۵/۱۷"
              readonly
            />
          </div>
          <div class="form-group">
            <label class="form-label" style="color: rgba(255, 255, 255, 0.9)"
              >نوع</label
            >
            <select id="manual-type" class="form-select">
              <option value="work">کار عادی</option>
              <option value="hourly_leave">مرخصی ساعتی</option>
              <option value="mission">ماموریت</option>
              <option value="overtime">اضافه‌کاری</option>
            </select>
          </div>
          <div class="form-group" id="manual-time-group">
            <div
              style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
              "
            >
              <div>
                <label
                  class="form-label"
                  style="color: rgba(255, 255, 255, 0.9)"
                  >ساعت ورود</label
                >
                <input
                  type="time"
                  id="manual-checkin"
                  class="form-input"
                  step="1"
                  required
                />
              </div>
              <div>
                <label
                  class="form-label"
                  style="color: rgba(255, 255, 255, 0.9)"
                  >ساعت خروج</label
                >
                <input
                  type="time"
                  id="manual-checkout"
                  class="form-input"
                  step="1"
                />
              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" style="color: rgba(255, 255, 255, 0.9)"
              >توضیحات</label
            >
            <textarea
              id="manual-desc"
              class="form-textarea"
              rows="2"
              placeholder="اختیاری"
            ></textarea>
          </div>
          <button type="submit" class="btn btn-success" style="width: 100%">
            <i class="fas fa-plus"></i> ثبت رکورد
          </button>
        </form>
      </div>

      <div
        class="glass-card animate-fade-in stagger-1"
        id="daily-leave-section"
        style="margin-bottom: 1rem"
      >
        <h3 style="color: white; font-weight: 700; margin-bottom: 1rem">
          <i class="fas fa-umbrella-beach" style="margin-left: 0.5rem"></i>ثبت
          مرخصی روزانه
        </h3>
        <form id="leave-form">
          <div class="form-group">
            <label class="form-label" style="color: rgba(255, 255, 255, 0.9)"
              >تاریخ</label
            >
            <input
              type="text"
              id="leave-date"
              class="form-input"
              placeholder="۱۴۰۳/۰۵/۱۷"
              readonly
            />
          </div>
          <div class="form-group">
            <label class="form-label" style="color: rgba(255, 255, 255, 0.9)"
              >توضیحات</label
            >
            <textarea
              id="leave-desc"
              class="form-textarea"
              rows="2"
              placeholder="اختیاری"
            ></textarea>
          </div>
          <button type="submit" class="btn btn-warning" style="width: 100%">
            <i class="fas fa-plus"></i> ثبت مرخصی
          </button>
        </form>
      </div>

      <div
        class="glass-card animate-fade-in stagger-2"
        style="margin-bottom: 1rem"
      >
        <h3 style="color: white; font-weight: 700; margin-bottom: 1rem">
          <i class="fas fa-database" style="margin-left: 0.5rem"></i
          >پشتیبان‌گیری
        </h3>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
          "
        >
          <button class="btn btn-primary" id="btn-export">
            <i class="fas fa-download"></i> خروجی JSON
          </button>
          <button
            class="btn btn-outline"
            onclick="document.getElementById('import-file').click()"
          >
            <i class="fas fa-upload"></i> بازگردانی
          </button>
        </div>
        <input
          type="file"
          id="import-file"
          accept=".json"
          style="display: none"
        />
      </div>

      <div
        class="glass-card animate-fade-in stagger-3"
        style="margin-bottom: 1rem; border: 1px solid rgba(239, 68, 68, 0.3)"
      >
        <h3 style="color: #fca5a5; font-weight: 700; margin-bottom: 1rem">
          <i
            class="fas fa-exclamation-triangle"
            style="margin-left: 0.5rem"
          ></i>
          zone خطر
        </h3>
        <button class="btn btn-danger" id="btn-clear-all" style="width: 100%">
          <i class="fas fa-trash-alt"></i> حذف تمام داده‌ها
        </button>
      </div>

      <div
        class="glass-card animate-fade-in stagger-4"
        style="text-align: center"
      >
        <div
          style="
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <i class="fas fa-clock" style="color: white; font-size: 1.8rem"></i>
        </div>
        <h3 style="color: white; font-weight: 700">حضور و غیاب شخصی</h3>
        <p
          style="
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-top: 0.25rem;
          "
        >
          نسخه 1.0.1
        </p>
        <p
          style="
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            margin-top: 0.5rem;
          "
        >
          یک PWA کاملاً آفلاین برای مدیریت ساعات کاری
        </p>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-jalaali@0.9.2/build/moment-jalaali.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <script src="./js/date-utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/pages/settings.js"></script>
  </body>
</html>
