<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#6366f1" />
    <title>سوابق حضور و غیاب</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="page-header">
        <h1 class="page-title">
          <i class="fas fa-list" style="margin-left: 0.5rem"></i>سوابق
        </h1>
        <button class="menu-btn" id="menu-btn-records">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input
          type="text"
          id="search-input"
          placeholder="جستجو در تاریخ یا توضیحات..."
        />
      </div>

      <div class="filter-bar" id="type-filters">
        <button class="filter-chip active" data-type="all">همه</button>
        <button class="filter-chip" data-type="work">کار</button>
        <button class="filter-chip" data-type="hourly_leave">
          مرخصی ساعتی
        </button>
        <button class="filter-chip" data-type="daily_leave">
          مرخصی روزانه
        </button>
        <button class="filter-chip" data-type="mission">ماموریت</button>
        <button class="filter-chip" data-type="overtime">اضافه‌کاری</button>
      </div>

      <div id="records-container">
        <div class="empty-state">
          <i class="fas fa-clipboard-list"></i>
          <p>هنوز رکوردی ثبت نشده است</p>
        </div>
      </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 style="font-weight: 700; color: #1f2937">ویرایش رکورد</h3>
          <button
            class="menu-btn"
            onclick="UI.closeModal('edit-modal')"
            style="
              width: 32px;
              height: 32px;
              background: #f3f4f6;
              color: #6b7280;
              border: none;
            "
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id" />
          <div class="form-group">
            <label class="form-label">تاریخ</label>
            <input type="text" id="edit-date" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">نوع</label>
            <select id="edit-type" class="form-select">
              <option value="work">کار عادی</option>
              <option value="hourly_leave">مرخصی ساعتی</option>
              <option value="daily_leave">مرخصی روزانه</option>
              <option value="mission">ماموریت</option>
              <option value="overtime">اضافه‌کاری</option>
            </select>
          </div>
          <div class="form-group" id="edit-time-group">
            <div
              style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
              "
            >
              <div>
                <label class="form-label">ورود</label>
                <input
                  type="time"
                  id="edit-checkin"
                  class="form-input"
                  step="1"
                />
              </div>
              <div>
                <label class="form-label">خروج</label>
                <input
                  type="time"
                  id="edit-checkout"
                  class="form-input"
                  step="1"
                />
              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">توضیحات</label>
            <textarea id="edit-desc" class="form-textarea" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-outline"
            onclick="UI.closeModal('edit-modal')"
            style="color: #6b7280; border-color: #d1d5db"
          >
            انصراف
          </button>
          <button class="btn btn-primary" id="edit-save-btn">ذخیره</button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-jalaali@0.9.2/build/moment-jalaali.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <script src="./js/date-utils.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/pages/records.js"></script>
  </body>
</html>
